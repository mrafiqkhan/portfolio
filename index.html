<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habib Rehman | WordPress & PHP Developer</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #f4f1e8;
            --muted: #a9aaa4;
            --accent: #c9f36b;
            --line: rgba(244, 241, 232, 0.16);
            --panel: #171817;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0c0c;
            color: var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
        }

        .portfolio {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px;
            background:
                radial-gradient(circle at 85% 15%, rgba(201, 243, 107, 0.12), transparent 28%),
                linear-gradient(135deg, #0b0c0c 0%, #101210 55%, #0b0c0c 100%);
        }

        .portfolio__inner {
            width: min(1120px, 100%);
            padding: clamp(28px, 6vw, 76px);
            border: 1px solid var(--line);
            background: rgba(23, 24, 23, 0.78);
        }

        .portfolio__topline,
        .portfolio__footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            font-family: Arial, sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .portfolio__topline {
            color: var(--muted);
        }

        .portfolio__mark {
            color: var(--accent);
        }

        .portfolio__content {
            max-width: 820px;
            margin: clamp(70px, 13vh, 150px) 0 clamp(80px, 14vh, 150px);
        }

        .portfolio__eyebrow {
            margin: 0 0 20px;
            color: var(--accent);
            font-family: Arial, sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 760px;
            margin: 0;
            font-size: clamp(3.5rem, 9vw, 8.5rem);
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: -0.05em;
        }

        .portfolio__intro {
            max-width: 540px;
            margin: 36px 0 0;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.7;
        }

        .portfolio__skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 32px;
        }

        .portfolio__skill {
            padding: 12px 16px;
            border: 1px solid var(--line);
            color: var(--ink);
            font-family: Arial, sans-serif;
            font-size: 0.8rem;
        }

        .portfolio__footer {
            padding-top: 24px;
            border-top: 1px solid var(--line);
            color: var(--muted);
        }

        .portfolio__availability {
            color: var(--accent);
        }

        @media (max-width: 600px) {
            .portfolio {
                padding: 14px;
            }

            .portfolio__inner {
                padding: 24px;
            }

            .portfolio__topline,
            .portfolio__footer {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .portfolio__content {
                margin: 90px 0 100px;
            }

            h1 {
                font-size: clamp(3.2rem, 17vw, 5rem);
            }
        }
    </style>
</head>
<body>
    <main class="portfolio">
        <section class="portfolio__inner" aria-labelledby="portfolio-title">
            <div class="portfolio__topline">
                <span class="portfolio__mark">HR / Portfolio</span>
                <span>Web development · 2026</span>
            </div>

            <div class="portfolio__content">
                <p class="portfolio__eyebrow">WordPress & PHP developer</p>
                <h1 id="portfolio-title">Habib<br>Rehman</h1>
                <p class="portfolio__intro">
                    I build thoughtful, reliable websites and digital experiences with clean WordPress solutions and practical PHP development.
                </p>
                <div class="portfolio__skills" aria-label="Areas of experience">
                    <span class="portfolio__skill">WordPress</span>
                    <span class="portfolio__skill">PHP</span>
                    <span class="portfolio__skill">Custom websites</span>
                </div>
            </div>

            <div class="portfolio__footer">
                <span class="portfolio__availability">Available for new projects</span>
                <span>Based in Pakistan</span>
            </div>
        </section>
    </main>
</body>
</html>
